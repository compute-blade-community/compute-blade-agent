name: Go Build - CI

on:
  workflow_dispatch:
  push:
    tags-ignore:
      - "v*"
    branches-ignore:
      - main

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

# A newer push to the same branch or PR makes older runs pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every step runs a mise task from mise.toml, so `mise run <task>` reproduces it locally (`mise run ci` runs all
# checks at once).
jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          cache-name: quality

      - name: Check formatting
        run: mise run fmt:check

      - name: Check the generated code
        run: mise run generate:check

      - name: Lint Go code
        run: mise run lint

      - name: Lint workflows
        run: mise run actionlint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          cache-name: test

      - name: Run tests
        run: mise run test

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: "coverage.txt"
          if-no-files-found: error

  code_coverage:
    name: "Code coverage report"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - test

    permissions:
      contents: read
      actions: read # to download code coverage results from "test" job
      pull-requests: write # write permission needed to comment on PR

    steps:
      - uses: fgrosse/go-coverage-report@v1.5.0
        with:
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          github-baseline-workflow-ref: "release.yaml"

  snapshot:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs:
      - test
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          cache-name: release

      # goreleaser builds the container image for arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds the fan unit firmware first (a dependency of the snapshot task), then every package and image
      - name: Build release artifacts
        run: mise run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive FanUnit Firmware
        uses: actions/upload-artifact@v7
        with:
          name: fanunit.uf2
          path: "fanunit.uf2"
          if-no-files-found: error

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compute-blade-agent
          path: dist/*-SNAPSHOT-*
          if-no-files-found: error
