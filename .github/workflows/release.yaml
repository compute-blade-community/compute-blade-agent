name: Go Release - Publish

on:
  push:
    branches:
      - main

permissions: write-all

# Every step runs a mise task from mise.toml, the same commands as a local build.
jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Also seeds the build cache on main, which pull requests restore from
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          cache-name: test

      - name: Run tests
        run: mise run test

      # Baseline for the coverage report on pull requests
      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: "coverage.txt"
          if-no-files-found: error

  # Release-please for auto-updated PRs
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          # actual releasing is handled by goreleaser; settings live in
          # release-please-config.json and .release-please-manifest.json
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}

  # Goreleaser for binary releases / GH release
  goreleaser:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - release-please

    if: needs.release-please.outputs.release_created

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          cache-name: release

      # Install cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4

      # Setup docker buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      # Builds the fan unit firmware first (a dependency of the release task), then publishes everything
      - name: Publish release
        run: mise run release
        env:
          COSIGN_YES: "true"
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
