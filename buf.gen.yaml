version: v1
# Local plugins, pinned in mise.toml: generating code needs no network access and isn't subject to BSR rate limits
plugins:
  - plugin: go
    path: protoc-gen-go
    out: .
    opt:
      - paths=source_relative
  - plugin: go-grpc
    path: protoc-gen-go-grpc
    out: .
    opt:
      - paths=source_relative
