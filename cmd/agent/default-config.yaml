# Default configuration for the compute-blade-agent

# Listen configuration
listen:
  metrics: ":9666"
  grpc: /tmp/compute-blade-agent.sock
  authenticated: false
  mode: unix # tcp or unix

# Hardware abstraction layer configuration
hal:
  # For the default fan unit, fanspeed measurement is causing a tiny bit of CPU load.
  # Sometimes it might not be desired
  rpm_reporting_standard_fan_unit: true

# Idle LED color, values range from 0-255
idle_led_color:
  red: 0
  green: 16
  blue: 0

# Identify LED color
identify_led_color:
  red: 16
  green: 0
  blue: 16

# Critical LED color (top LED)
critical_led_color:
  red: 64
  green: 0
  blue: 0

# Enable/disable stealth mode; turns off all LEDs on the blade
stealth_mode: false

# Simple fan-speed controls based on the SoC temperature
fan_controller:
  steps:
    - temperature: 45
      percent: 40
    - temperature: 55
      percent: 80

# Critical temperature threshold (°C). When the SoC reaches this temperature the agent enters critical mode
# (fan at 100%, stealth mode off, top LED blinking). Critical mode is cleared again once the temperature drops
# 5°C below the threshold. Set to 0 to disable automatic critical mode.
critical_temperature_threshold: 60

# Health condition detection
health:
  # Detects a fan that is commanded to spin but doesn't (e.g. a dead or blocked fan).
  # Requires RPM reporting (smart fan unit, or standard fan unit with rpm_reporting_standard_fan_unit: true).
  fan_stall:
    enabled: true
    # Only judge a stall when the commanded fan speed is at least this (some fans stop at very low duty cycles)
    min_percent: 20
    # Below this speed the fan counts as not spinning
    min_rpm: 100
    # How long the fan has to stay below min_rpm before a stall is raised (covers spin-up)
    grace_period: 15s
  # Detects a too low supply voltage, e.g. a PoE switch running out of power budget (Raspberry Pi firmware flag)
  undervoltage:
    enabled: true
    # How long the voltage has to be fine again before the condition clears
    clear_after: 30s
  # Detects CPU throttling: frequency capped, throttled or at the soft temperature limit (Raspberry Pi firmware flags)
  throttling:
    enabled: true
    clear_after: 30s

# LED indicators for health conditions, keyed by condition.
#   led:      top, edge or none (don't show the condition)
#   pattern:  static, slow-blink, fast-blink or burst
#   priority: 0-999, decides which indicator is shown if several are active on the same LED (higher wins).
#             Identify (edge LED) and critical mode (top LED) always take precedence.
indicators:
  fan_stall:
    led: top
    pattern: fast-blink
    priority: 30
    color:
      red: 64
      green: 24
      blue: 0
  undervoltage:
    led: top
    pattern: burst
    priority: 20
    color:
      red: 64
      green: 40
      blue: 0
  # Throttling is common under sustained load (soft temperature limit), so it isn't shown by default
  throttled:
    led: none
    pattern: slow-blink
    priority: 10
    color:
      red: 32
      green: 32
      blue: 0

# Limit the CPU while the blade is short on power. Disabled unless at least one field is set.
# Fields: governor (cpufreq governor, e.g. powersave) and max_freq_mhz (CPU frequency cap, 0 = no cap).
# When several apply at once, the lowest frequency cap wins and the under-voltage governor takes precedence.
# The original settings are restored as soon as no limit applies, and when the agent stops.
power_policy:
  # Applies while the blade isn't powered by 802.3at PoE+ (802.3af PoE or USB-C)
  # Note: the RK3588 HAL can't detect PoE+ yet and always reports 802.3af/USB-C
  limited_power:
    governor: ""
    max_freq_mhz: 0
  # Applies while the undervoltage condition is raised (requires health.undervoltage.enabled)
  undervoltage:
    governor: ""
    max_freq_mhz: 0

# Edge button gestures. Each gesture runs either a built-in action or a command:
#   action: one of none, identify-toggle, shutdown, reboot, emergency-poweroff
#   exec:   a command and its arguments, run directly (not through a shell) with these environment variables:
#           BLADE_EVENT, BLADE_GESTURE, BLADE_PRESS_COUNT, BLADE_HOLD_MS, BLADE_HOSTNAME
#   timeout: how long exec may run before it is killed (default 30s)
# Every gesture is also published as a button_gesture event (bladectl events), whether or not an action is bound.
# The fan unit button always toggles identify; it doesn't do gestures.
#
# emergency-poweroff cuts power right away without stopping services or unmounting file systems (it tries to flush
# data for up to 2s). Use it for a blade whose shutdown hangs; file systems may need repair on the next boot.
button:
  # Longest gap between two presses for them to count as one gesture
  gesture_window: 400ms
  # Defaults to identify-toggle; set `action: none` to disable
  single:
    action: identify-toggle
  double: {}
  # Holding the button. The edge LED blinks white after 1s to show a long press is coming.
  long_press:
    hold: 5s
    # action: shutdown
  # A series of `count` short presses (at least 3). Fires as soon as the count is reached.
  multi_press:
    count: 5
    # action: emergency-poweroff
