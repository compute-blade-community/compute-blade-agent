version: 2

project_name: compute-blade-agent

before:
  hooks:
    - go mod tidy

builds:
  - id: agent
    env: &env
      - CGO_ENABLED=0
    goos: &goos
      - linux
    goarch: &goarch
      - arm64
    binary: compute-blade-agent
    dir: ./cmd/agent/
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: &ldflags
      - -X=main.Version={{.Version}}
      - -X=main.Commit={{.Commit}}
      - -X=main.Date={{ .CommitTimestamp }}

  - id: bladectl
    env: *env
    goos: *goos
    goarch: *goarch
    binary: bladectl
    dir: ./cmd/bladectl/
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: *ldflags

  - id: bladectl_other
    env: *env
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
    binary: bladectl
    dir: ./cmd/bladectl/
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: *ldflags

# Docker image including both agent and bladectl, built and pushed in one buildx run
dockers_v2:
  - id: oci-bundle
    ids:
      - agent
      - bladectl
    images:
      - ghcr.io/compute-blade-community/compute-blade-agent
    tags:
      - latest
      - "{{ .Tag }}"
      - "v{{ .Major }}"
    platforms:
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

# Sign docker-image with cosign (keyless), by digest so every tag is covered
docker_signs:
  - id: oci-bundle-sign
    # cosign v3 pushes the Sigstore bundle to ghcr.io as an OCI referrer of the image
    # verify with: cosign verify <image> \
    #   --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
    #   --certificate-identity=https://github.com/compute-blade-community/compute-blade-agent/.github/workflows/release.yaml@refs/heads/main
    args:
    - "sign"
    - "${artifact}@${digest}"
    - --yes
    ids:
    - oci-bundle

# Sign everything else
signs:
   - cmd: cosign
     # cosign v3 writes a single Sigstore bundle (signature + certificate)
     # verify with: cosign verify-blob --bundle <artifact>.sigstore.json ...
     signature: "${artifact}.sigstore.json"
     args:
     - sign-blob
     - "--bundle=${signature}"
     - "${artifact}"
     - --yes
     artifacts: all

# Regular OS packages (for now only systemd based OSes)
nfpms:
- id: compute-blade-agent
  package_name: compute-blade-agent
  ids:
    - bladectl
    - agent
  maintainer: Matthias Riegler <me@xvzf.tech>
  description: compute-blade Agent
  homepage: https://github.com/compute-blade-community/compute-blade-agent
  vendor: Uptime Industries Inc.
  license: Apache 2.0
  formats:
  - deb
  - rpm
  - archlinux
  bindir: /usr/bin
  contents:
  - src: ./hack/systemd/compute-blade-agent.service
    dst: /etc/systemd/system/compute-blade-agent.service
  - src: ./cmd/agent/default-config.yaml
    dst: /etc/compute-blade-agent/config.yaml
    type: config
  - src: ./fanunit.uf2
    dst: /usr/share/compute-blade-agent/fanunit.uf2

- id: bladectl
  package_name: bladectl
  ids:
    - bladectl
    - bladectl_other
  maintainer: Matthias Riegler <me@xvzf.tech>
  description: bladectl
  homepage: https://github.com/compute-blade-community/compute-blade-agent
  vendor: Uptime Industries Inc.
  license: Apache 2.0
  formats:
    - deb
    - rpm
    - archlinux
  bindir: /usr/bin

archives:
  - id: compute-blade-agent
    ids:
      - agent
      - bladectl
    name_template: 'compute-blade-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'

  - id: bladectl
    ids:
      - bladectl
      - bladectl_other
    name_template: 'bladectl_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'

release:
  extra_files:
    - glob: ./fanunit.uf2
